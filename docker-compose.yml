# Local development stack: MongoDB, Redis and the app.
#
# One app service, not three: the Express backend and the Vite SPA that used
# to sit alongside this were the same product implemented twice, and both are
# gone. `app` serves the dashboard, the API, the Meta webhook, Socket.IO and
# the background workers from one process.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ keeps queue state here; an eviction policy that drops keys under
    # memory pressure silently discards queued messages.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: nextjs/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/metabsp
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      # Dev-only placeholders. Override with a local .env or your shell before
      # running this anywhere but a throwaway environment — and never point it
      # at a database holding real encrypted tokens with this key.
      JWT_SECRET: dev-only-change-me
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktY2hhbmdlLW1lITE=
      # Signature enforcement off locally so a hand-crafted webhook payload can
      # be replayed without signing it. Never set this in a deployed
      # environment: it makes the webhook accept anything from anyone.
      WHATSAPP_ENFORCE_WEBHOOK_SIGNATURE: "false"
    depends_on:
      - mongo
      - redis

  # Optional dedicated worker instance: run the queue consumers and schedulers
  # separately from the web instance to scale send throughput independently.
  # Not started by a plain `docker compose up` — opt in with
  # `docker compose --profile scale-workers up worker`.
  worker:
    profiles: ["scale-workers"]
    build:
      context: .
      dockerfile: nextjs/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/metabsp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-change-me
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktY2hhbmdlLW1lITE=
      RUN_BACKGROUND_JOBS: "true"
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  redis_data:
