services:
  - type: web
    name: metabsp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

      # ── WhatsApp Cloud (Metabsp) ─────────────────────────────────
      # ACCESS_TOKEN_SECRET is a legacy alias for JWT_SECRET below, read only
      # if JWT_SECRET is unset. Set JWT_SECRET going forward.
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      # WHATSAPP_API_VERSION is the canonical name (see
      # backend/src/config/graphApi.js); META_API_VERSION below is read only
      # as a legacy fallback if this is unset.
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: META_API_VERSION
        value: v18.0
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      # Coexistence (WhatsApp Business app + Cloud API on one number).
      # The `history`, `smb_message_echoes` and `smb_app_state_sync` webhook
      # fields ARE now subscribed in the Meta App Dashboard (confirmed
      # 2026-08-25), so the original blocker is cleared and the boot-time
      # pre-flight check re-verifies it every restart.
      # Still off pending the one remaining gate in COEXISTENCE.md: a real
      # coexistence onboarding run end to end against a live WhatsApp
      # Business app number. Flip to "true" once that passes.
      - key: META_ENABLE_COEXISTENCE
        value: "false"
      # Social sign-in — optional and additive; each provider stays hidden on
      # the login page until configured. Facebook falls back to META_APP_ID /
      # META_APP_SECRET above when these are unset.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      # `email` is not available to a WhatsApp-Business-Messaging app until the
      # Facebook Login use case is added in the App Dashboard; requesting it
      # before then fails the login dialog outright. Switch to
      # "public_profile,email" once enabled.
      - key: FACEBOOK_LOGIN_SCOPES
        value: public_profile
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ENFORCE_WEBHOOK_SIGNATURE
        value: "true"
      - key: WHATSAPP_TOKEN_ENCRYPTION_KEY
        sync: false

      # ── Auth (shared by every login path) ────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # BOOTSTRAP_USERNAME/PASSWORD are optional: an env-configured super-admin
      # login that upserts (and keeps in sync with) a real DB user on first use.
      - key: BOOTSTRAP_USERNAME
        sync: false
      - key: BOOTSTRAP_NAME
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      # SUPER_ADMIN_USERNAME/PASSWORD: set both to seed a super admin at boot.
      # There is no default password — leaving these unset just skips seeding.
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_MOBILE
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: REDIS_URL
        fromService:
          type: redis
          name: metabsp-redis
          property: connectionString

  - type: redis
    name: metabsp-redis
    ipAllowList: []
    plan: starter
