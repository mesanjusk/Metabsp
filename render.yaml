# One web service, one Redis instance.
#
# This used to describe two web services — an Express host and a Next.js host —
# running the same product against the same database, with the split existing
# only because the migration between them was unfinished. The Express half is
# gone; `nextjs/` serves the App Router, the API, the Meta webhook, Socket.IO,
# the queue workers and the schedulers from one persistent Node process
# (see nextjs/server.js and nextjs/instrumentation.ts for how those coexist).
#
# CUTOVER, before merging this to a branch Render auto-deploys:
#   1. Point the Meta App Dashboard webhook callback URL at this service's
#      /webhook path and re-verify it.
#   2. Add this service's origin to the Meta app's Allowed Domains for the
#      JavaScript SDK, or Embedded Signup fails with a JSSDK host error.
#   3. Copy MONGO_URI, JWT_SECRET and WHATSAPP_TOKEN_ENCRYPTION_KEY across
#      VERBATIM from the old service. A different encryption key does not
#      error — it silently fails to decrypt every stored access token, and
#      every connected number stops sending.
#   4. Point the production domain at this service, then retire the old one.
services:
  - type: web
    name: metabsp
    runtime: node
    rootDir: nextjs
    branch: main
    autoDeploy: true
    # Config gate, then typecheck, then the test suite, then the build. Each
    # fails the deploy on its own, so a broken deployment never reaches Meta's
    # webhook — an endpoint Meta disables if it stays unhealthy.
    buildCommand: node ../scripts/meta-deploy-check.js && npm ci && npm run typecheck && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: metabsp-redis
          property: connectionString

      # ── Sessions ────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── Public origin ───────────────────────────────────────────────────
      # FRONTEND_URL is the canonical public origin. ALLOWED_ORIGINS is the
      # comma-separated CORS and websocket allow-list; leave it unset for a
      # single-origin deployment, which is the normal case now that the app
      # and its API are one service.
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # ── Meta ────────────────────────────────────────────────────────────
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: META_API_VERSION
        value: v23.0
      - key: META_ES_VERSION
        value: v4
      # Keep false until the three coexistence webhook fields are subscribed
      # in the App Dashboard AND one real coexistence onboarding has been run
      # end to end — otherwise the Embedded Signup popup offers a path whose
      # traffic goes nowhere. See docs/meta-tech-provider/COEXISTENCE.md.
      - key: META_ENABLE_COEXISTENCE
        value: "true"
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ENFORCE_WEBHOOK_SIGNATURE
        value: "true"
      # Must match the value that encrypted the data already in MONGO_URI.
      - key: WHATSAPP_TOKEN_ENCRYPTION_KEY
        sync: false

      # ── Media storage ───────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Background work ─────────────────────────────────────────────────
      # true on every instance is correct for a single-instance deployment:
      # the schedulers coordinate through a Redis leader lock, and the two
      # queue workers are meant to run as competing consumers. Set false on
      # web instances only if you also run dedicated worker instances.
      - key: RUN_BACKGROUND_JOBS
        value: "true"
      - key: KEEP_ALIVE_TOKEN
        sync: false

      # ── App Review ──────────────────────────────────────────────────────
      # Set true on the exact deployment submitted to Meta, so missing
      # reviewer credentials fail the build instead of reaching Meta broken.
      - key: META_REVIEW_ENFORCE_READY
        value: "false"
      - key: META_REVIEWER_LOGIN
        sync: false
      - key: META_REVIEWER_PASSWORD
        sync: false
      - key: META_REVIEW_CONTACT_EMAIL
        sync: false

  - type: redis
    name: metabsp-redis
    ipAllowList: []
    plan: starter
    # noeviction is required, not a preference: BullMQ keeps queue state in
    # Redis, and an eviction policy that drops keys under memory pressure
    # silently discards queued customer messages.
    maxmemoryPolicy: noeviction
