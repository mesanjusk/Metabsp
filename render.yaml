services:
  - type: web
    name: metabsp-backend
    runtime: node
    rootDir: backend
    branch: main
    autoDeploy: true
    buildCommand: node ../scripts/meta-deploy-check.js && npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: META_API_VERSION
        value: v23.0
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: META_ENABLE_COEXISTENCE
        value: "true"
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ENFORCE_WEBHOOK_SIGNATURE
        value: "true"
      - key: WHATSAPP_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        fromService:
          type: redis
          name: metabsp-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_LOGIN_SCOPES
        value: public_profile
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: BOOTSTRAP_USERNAME
        sync: false
      - key: BOOTSTRAP_NAME
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_MOBILE
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: KEEP_ALIVE_TOKEN
        sync: false
      # Set true only for the deployment that will be submitted to Meta.
      # When true, the build gate requires all reviewer credential fields.
      - key: META_REVIEW_ENFORCE_READY
        value: "false"
      - key: META_REVIEWER_LOGIN
        sync: false
      - key: META_REVIEWER_PASSWORD
        sync: false
      - key: META_REVIEW_CONTACT_EMAIL
        sync: false

  - type: web
    name: metabsp-nextjs
    runtime: node
    rootDir: nextjs
    branch: main
    autoDeploy: true
    buildCommand: node ../scripts/meta-deploy-check.js && npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: metabsp-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: META_API_VERSION
        value: v23.0
      - key: META_ES_VERSION
        value: v4
      - key: META_ENABLE_COEXISTENCE
        value: "true"
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ENFORCE_WEBHOOK_SIGNATURE
        value: "true"
      - key: WHATSAPP_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RUN_BACKGROUND_JOBS
        value: "false"
      - key: KEEP_ALIVE_TOKEN
        sync: false
      - key: META_REVIEW_ENFORCE_READY
        value: "false"
      - key: META_REVIEWER_LOGIN
        sync: false
      - key: META_REVIEWER_PASSWORD
        sync: false
      - key: META_REVIEW_CONTACT_EMAIL
        sync: false

  - type: redis
    name: metabsp-redis
    ipAllowList: []
    plan: starter
    maxmemoryPolicy: noeviction
