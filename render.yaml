# One web service, one Redis instance.
#
# This used to describe two web services — an Express host and a Next.js host —
# running the same product against the same database, with the split existing
# only because the migration between them was unfinished. The Express half is
# gone; `nextjs/` serves the App Router, the API, the Meta webhook, Socket.IO,
# the queue workers and the schedulers from one persistent Node process
# (see nextjs/server.js and nextjs/instrumentation.ts for how those coexist).
#
# CUTOVER, before merging this to a branch Render auto-deploys:
#   1. Point the Meta App Dashboard webhook callback URL at this service's
#      /webhook path and re-verify it.
#   2. Add this service's origin to the Meta app's Allowed Domains for the
#      JavaScript SDK, or Embedded Signup fails with a JSSDK host error.
#   3. Copy MONGO_URI, JWT_SECRET and WHATSAPP_TOKEN_ENCRYPTION_KEY across
#      VERBATIM from the old service. A different encryption key does not
#      error — it silently fails to decrypt every stored access token, and
#      every connected number stops sending.
#   4. Point the production domain at this service, then retire the old one.
services:
  - type: web
    name: metabsp
    runtime: node
    rootDir: nextjs
    branch: main
    autoDeploy: true
    # Not `free`, and this is a functional requirement rather than a comfort.
    # Render spins a free web service down after 15 minutes without inbound
    # traffic and takes about a minute to wake it: Meta retries a webhook that
    # slow and eventually disables the subscription outright, and an App Review
    # reviewer opening the dashboard would wait out that same cold start. A
    # free instance also holds no persistent disk and only 512 MB, which a
    # coexistence history backfill (up to 180 days of chats) will exhaust.
    # Keeping a free instance awake by pinging it is not a substitute: the free
    # allowance is 750 instance-hours per month for the whole workspace, and a
    # calendar month is ~730 hours, so one always-on free service consumes it
    # all and Render then suspends every free service until the 1st.
    plan: starter
    # Config gate, then typecheck, then the test suite, then the build. Each
    # fails the deploy on its own, so a broken deployment never reaches Meta's
    # webhook — an endpoint Meta disables if it stays unhealthy.
    #
    # `--include=dev` is load-bearing: NODE_ENV=production is set below, and a
    # plain `npm ci` under it omits devDependencies — so `npm test` died with
    # "sh: 1: vitest: not found" before running a single test. The gate had
    # already passed at that point, which is the dangerous shape of this bug:
    # it reads as a configuration failure when it is an install failure. It
    # went unnoticed because the service this replaces built with
    # `npm install && npm run build` and never ran the suite at all, and
    # because CI does not set NODE_ENV. Runtime is unaffected either way —
    # nextjs/package.json's `start` sets NODE_ENV=production itself.
    buildCommand: node ../scripts/meta-deploy-check.js && npm ci --include=dev && npm run typecheck && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: metabsp-redis
          property: connectionString

      # ── Sessions ────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── Public origin ───────────────────────────────────────────────────
      # FRONTEND_URL is the canonical public origin. ALLOWED_ORIGINS is the
      # comma-separated CORS and websocket allow-list; leave it unset for a
      # single-origin deployment, which is the normal case now that the app
      # and its API are one service.
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # ── E-Store domains ────────────────────────────────────────────────
      # Add *.store.meta.sanjusk.in once in Render and GoDaddy. Every new
      # account then receives a subdomain without a per-signup DNS API call.
      - key: STORE_SUBDOMAIN_BASE
        value: store.meta.sanjusk.in
      - key: STORE_DOMAIN_CNAME_TARGET
        value: metabsp.onrender.com
      # Used only after a store owner proves control with DNS. The server adds
      # that one customer domain to this Render service so Render can issue TLS.
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false

      # ── Meta ────────────────────────────────────────────────────────────
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: META_API_VERSION
        value: v23.0
      # The Facebook JS SDK version the browser loads for the Embedded Signup
      # popup (FB.init). This is deliberately separate from the Graph API
      # version above. Meta's current production Embedded Signup Builder emits
      # v26.0 for this configuration.
      - key: META_JS_SDK_VERSION
        value: v26.0
      # The current configuration is Embedded Signup v4. This is sent in
      # FB.login extras.version and kept separate from both SDK and Graph API
      # versions so future Builder migrations are explicit.
      - key: META_EMBEDDED_SIGNUP_VERSION
        value: v4
      # Meta's Builder still reports Session Info Version 3 for this config.
      # It remains available for diagnostics/parser compatibility, but the v4
      # launch itself follows Meta's generated code and does not send it.
      - key: META_ES_SESSION_INFO_VERSION
        value: "3"
      # Enabled: the three coexistence webhook fields (history,
      # smb_message_echoes, smb_app_state_sync) are subscribed in the App
      # Dashboard, so the Embedded Signup popup may offer the WhatsApp Business
      # app onboarding path and its traffic has somewhere to land. Verify with
      # GET /api/whatsapp/preflight (webhook_fields.notReadyForCoexistence must
      # be empty) before trusting this. As a launch gate, run one real
      # coexistence onboarding end to end and confirm the three webhook
      # payloads match this code. See docs/meta-tech-provider/COEXISTENCE.md.
      - key: META_ENABLE_COEXISTENCE
        value: "true"
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ENFORCE_WEBHOOK_SIGNATURE
        value: "true"
      # Must match the value that encrypted the data already in MONGO_URI.
      - key: WHATSAPP_TOKEN_ENCRYPTION_KEY
        sync: false

      # ── Media storage ───────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Background work ─────────────────────────────────────────────────
      # true on every instance is correct for a single-instance deployment:
      # the schedulers coordinate through a Redis leader lock, and the two
      # queue workers are meant to run as competing consumers. Set false on
      # web instances only if you also run dedicated worker instances.
      - key: RUN_BACKGROUND_JOBS
        value: "true"
      - key: KEEP_ALIVE_TOKEN
        sync: false

      # ── App Review ──────────────────────────────────────────────────────
      # Set true on the exact deployment submitted to Meta, so missing
      # reviewer credentials fail the build instead of reaching Meta broken.
      - key: META_REVIEW_ENFORCE_READY
        value: "false"
      - key: META_REVIEWER_LOGIN
        sync: false
      - key: META_REVIEWER_PASSWORD
        sync: false
      - key: META_REVIEW_CONTACT_EMAIL
        sync: false


      # ── Video Studio ────────────────────────────────────────────────────
      # The ported studio (services/video) shares this service's Mongo and
      # Redis — see nextjs/lib/video/core/db/mongoose.ts, which delegates to
      # lib/db/mongo.ts rather than opening a second pool on MONGODB_URI.
      # What it needs of its own:
      #
      # Story and image generation. The studio treats a connected Google
      # account in its own Accounts screen as the primary credential and this
      # key as the fallback, so a deployment can run on either.
      - key: GEMINI_API_KEY
        sync: false
      # Image generation has no free tier on any Gemini model: a key without
      # billing is refused outright rather than rate-limited, and the studio
      # reports that as a billing fact rather than a quota to wait out. Leave
      # unset to route images through Google Flow in a browser instead.
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image

      # Encrypts the studio's own stored secrets — pooled Google account API
      # keys and Flow browser sessions. Separate from
      # WHATSAPP_TOKEN_ENCRYPTION_KEY above on purpose: one key per trust
      # domain, so rotating either does not invalidate the other's data.
      # Changing it does not error; it silently fails to decrypt everything
      # already stored.
      - key: ENCRYPTION_KEY
        sync: false

      # The Chrome extension that draws images in Google Flow authenticates
      # with this. Unset, every one of its three endpoints answers 401, the
      # extension cannot report itself connected, and every image job parks —
      # with nothing in the UI saying why, which is why Settings → System
      # status now shows this row. Any long random string; the same value goes
      # into the extension's side panel.
      - key: BROWSER_EXTENSION_TOKEN
        sync: false

      # Storage for generated assets reuses the CLOUDINARY_* values above.
      - key: STORAGE_PROVIDER
        value: cloudinary

      # On, and it no longer means Playwright. Clips are generated by the Chrome
      # extension in the operator's own browser, the same route the images take,
      # so this host needs no Chromium and spends no CPU on an encoder — which
      # matters on an instance capped at 0.15 vCPU. The Playwright route still
      # exists for a deployment with a worker; it is simply not this one.
      - key: ENABLE_BROWSER_FALLBACK
        value: "true"

      # A clip is bigger than a still, and this host is a persistent Node process
      # rather than a serverless function, so it has no 4.5MB request ceiling to
      # respect. 32MB comfortably holds an 8-second Flow export.
      - key: EXTENSION_RESULT_MAX_MB
        value: "32"

  - type: redis
    name: metabsp-redis
    ipAllowList: []
    plan: starter
    # noeviction is required, not a preference: BullMQ keeps queue state in
    # Redis, and an eviction policy that drops keys under memory pressure
    # silently discards queued customer messages.
    #
    # Confirm persistence is ON for this instance in the Render dashboard after
    # a blueprint deploy. It is not settable here, and with it off a restart
    # loses every queued inbound webhook and outbound send — the same silent
    # message loss the eviction policy above exists to prevent. The application
    # cannot verify either setting at boot: Render blocks CONFIG GET, so the
    # startup self-check reports "could not verify" rather than a pass.
    maxmemoryPolicy: noeviction
