# The repository had no CI that built or tested anything — only a deploy
# watcher and a keep-alive pinger. A broken change reached Render's build
# before anyone saw it, and Render's build is what stands between a bad commit
# and the live Meta webhook.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - run: npm ci

      - name: Typecheck (application)
        id: app_typecheck
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee ../typecheck.log
        continue-on-error: true

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: warn

      - name: Stop on application typecheck failure
        if: steps.app_typecheck.outcome == 'failure'
        run: exit 1

      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Test
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-build-only
          WHATSAPP_TOKEN_ENCRYPTION_KEY: Y2ktYnVpbGQtb25seS0zMi1ieXRlLWtleS0xMjM0NQ==

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - run: npm ci
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev || true
