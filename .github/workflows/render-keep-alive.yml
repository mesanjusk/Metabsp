name: Render Keep Alive

on:
  schedule:
    # Ping every 12 minutes to keep a Render free web service from idling.
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health endpoint
        env:
          CONFIGURED_URL: ${{ secrets.RENDER_KEEPALIVE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          # ?strict=1 keeps this ping meaning "the app can reach its database".
          # Plain /api/health is now a liveness probe for Render's rollout gate
          # and answers 200 while the process is serving, which would make this
          # job pass through a total database outage without a word.
          URL="${CONFIGURED_URL:-https://metabsp.onrender.com/api/health?strict=1}"
          echo "Pinging Render health endpoint..."

          # Allow enough time for a sleeping free instance to wake up.
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" >/dev/null

          echo "Keep-alive ping succeeded."
