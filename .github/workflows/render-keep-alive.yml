name: Render keep-alive

# Render's free web-service tier spins a service down after ~15 minutes with
# no inbound HTTP request. Pinging every service well inside that window
# keeps them warm, so an inbound WhatsApp webhook forwarded to a sibling
# project never hits a cold start. This does not touch WhatsApp/Meta at all
# — it's plain HTTP GETs.
#
# Every 12 minutes, around the clock.
#
# This used to run only 07:00-23:00 IST, which left the service asleep for
# eight hours every night. That is not a quiet period for a WhatsApp BSP: an
# inbound customer message arriving at 02:00 IST hit a ~60-second cold start,
# and Meta counts a webhook that slow as a failure — enough of them and it
# disables the subscription. It also put the dead zone squarely inside US
# working hours, which is when a Meta App Review reviewer would open the
# dashboard.
#
# BEFORE RELYING ON THIS, read the instance-hour arithmetic, because getting
# it wrong suspends the service rather than merely slowing it:
#
#   Render's free tier grants 750 instance-hours per month PER WORKSPACE, and
#   a calendar month is ~730-744 hours. A service kept awake around the clock
#   therefore consumes very nearly the entire workspace allowance on its own.
#   Any other non-suspended free service in the same workspace pushes the
#   total past 750, at which point Render suspends EVERY free service in that
#   workspace until the 1st — this one included, potentially mid-review.
#
#   So this schedule is only safe in a workspace where this service is
#   effectively alone. If it shares a workspace with other free services,
#   either suspend them or narrow this schedule back to a daytime window and
#   accept the nightly cold starts.
#
# GitHub Actions cron is also best-effort — a scheduled run can be delayed
# under load, and GitHub disables schedules on a repository with no activity
# for 60 days. A second external pinger (cron-job.org, UptimeRobot) is worth
# having as a backstop; both are free and more punctual than Actions.
on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

# Set this to the deployed service URL. The old value here was a legacy
# Render slug from a service that no longer exists after consolidation.
env:
  METABSP_URL: ${{ vars.METABSP_URL }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Metabsp itself
        run: |
          curl -sS -o /dev/null -w "metabsp-backend (self): HTTP %{http_code} in %{time_total}s\n" \
            --max-time 25 "${METABSP_URL}/api/health" || true

      - name: Ping every registered webhook destination
        run: |
          targets=$(curl -sS --max-time 25 "${METABSP_URL}/api/whatsapp/webhook-destinations/keep-alive-targets" \
            | jq -r '.targets[]? | "\(.label)\t\(.url)"') || true

          if [ -z "$targets" ]; then
            echo "No active webhook destinations returned — nothing else to ping."
            exit 0
          fi

          echo "$targets" | while IFS=$'\t' read -r label url; do
            [ -z "$url" ] && continue
            curl -sS -o /dev/null -w "${label}: HTTP %{http_code} in %{time_total}s\n" \
              --max-time 25 "$url" || true
          done
