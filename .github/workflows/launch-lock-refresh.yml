name: Refresh launch hardening lockfile

on:
  push:
    branches: [feat/launch-readiness-hardening-20261005]
    paths:
      - nextjs/package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launch-readiness-hardening-20261005

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve exact dependency tree
        run: |
          echo "package-lock config: $(npm config get package-lock)"
          node -e "console.log('requested next', require('./package.json').dependencies.next)"
          rm -f package-lock.json
          npm install --package-lock=true --ignore-scripts
          test -s package-lock.json

      - name: Show production audit
        run: npm audit --omit=dev || true

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:feat/launch-readiness-hardening-20261005
